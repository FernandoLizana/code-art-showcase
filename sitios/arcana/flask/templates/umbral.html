{% extends "base.html" %}
{% block content %}
<div class="center fade-in">
  <p class="narrative">Has cruzado el umbral.</p>
  {% if need_choice %}
  <form method="post" class="door-choice" style="margin-top:2rem">
    <button type="submit" name="path" value="left" class="door">I</button>
    <button type="submit" name="path" value="right" class="door">II</button>
  </form>
  {% elif next_level %}
  <a href="{{ url_for('nivel', numero=next_level) }}" class="btn" style="margin-top:2rem">Continuar</a>
  {% else %}
  <a href="{{ url_for('final') }}" class="btn" style="margin-top:2rem">Continuar</a>
  {% endif %}
</div>
{% endblock %}
