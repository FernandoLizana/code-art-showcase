{% extends "base.html" %}
{% block content %}
<div class="center">
  <div class="panel fade-in">
    <p class="terminal" style="color:var(--accent-red);text-transform:uppercase;margin-bottom:1.5rem">Advertencia</p>
    <div class="narrative" style="text-align:left">
      <p>Lo que sigue no es un juego. Tampoco es un sueño.</p>
      <p>Algunas puertas, una vez abiertas, no pueden cerrarse del mismo modo.</p>
      <p style="color:var(--text-faint);font-size:0.95rem">No se recopilará tu ubicación, cámara ni micrófono.</p>
    </div>
    <form method="post" style="margin-top:2rem;display:flex;gap:1rem;flex-wrap:wrap">
      <button type="submit" class="btn">Comprendo</button>
      <a href="{{ url_for('index') }}" class="btn btn-ghost">Retirarme</a>
    </form>
  </div>
</div>
{% endblock %}
