<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}{{ game_name }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/arcana.css') }}">
</head>
<body class="grain{% if body_class %} {{ body_class }}{% endif %}">
  <div class="symbol-bg" aria-hidden="true">
    <svg viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="0.5">
      <circle cx="100" cy="100" r="80"/><circle cx="100" cy="100" r="40"/>
      <line x1="100" y1="20" x2="100" y2="180"/><line x1="20" y1="100" x2="180" y2="100"/>
    </svg>
  </div>
  <div class="layout">
    <main>{% block content %}{% endblock %}</main>
    <footer>{{ game_name }}</footer>
  </div>
  <script src="{{ url_for('static', filename='js/fingerprint.js') }}"></script>
  <script src="{{ url_for('static', filename='js/ambient.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
